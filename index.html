<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asakura Yoda</title>
<link rel="icon" href="assets/profile.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#23262b;--mute:#6b7076;--line:rgba(35,38,43,.13);--panel:rgba(255,255,255,.86);--accent:#a8453f;--soft:#f1e2e0;--paper:#f1eeea;--slate:#202327;
--f:"Zen Maru Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--f);font-weight:500;color:var(--ink);background:var(--slate);-webkit-tap-highlight-color:transparent}
body.in{background:#fff}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Home */
#home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 22px;color:var(--paper)}
#av{width:132px;height:132px;border-radius:50%;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.35);user-select:none;-webkit-user-drag:none}
#home h1{font-size:1.6rem;font-weight:700;margin-top:8px}
#home .sub{color:#a9a5a0;margin-top:-8px}
.links{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;margin-top:18px}
.links a{display:block;text-align:center;text-decoration:none;background:var(--paper);color:var(--ink);padding:16px 18px;border-radius:16px;font-weight:700;transition:transform .15s,background .15s}
.links a:hover{background:#fff;transform:translateY(-2px)}

/* Login */
dialog{border:0;border-radius:18px;padding:0;background:#fff;color:var(--ink);max-width:calc(100vw - 32px)}
dialog::backdrop{background:rgba(20,22,25,.6)}
#login{width:340px}
#login form{display:flex;flex-direction:column;gap:12px;padding:24px}
#login h2{font-size:1.2rem}
label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--mute)}
input,select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:1rem;min-width:0}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:.9rem}
#err{color:var(--accent);font-size:.9rem;min-height:1.2em}

/* Cloud */
#bgwrap{position:fixed;inset:0;z-index:0;background:#fff}
#bg{width:100%;height:100%;object-fit:cover;filter:brightness(.1)}
@media (min-aspect-ratio:1/1){#bg{object-fit:contain}}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:100dvh}
.bar{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1 1 160px}
#crumbs{gap:2px}
#crumbs button{background:none;border:0;padding:4px 6px;border-radius:8px;font-weight:700}
#crumbs button:hover{background:var(--soft)}
#crumbs span{color:var(--mute)}
#info{margin-left:auto;font-size:.85rem;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 14px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
#list{flex:1}
#list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
#list.lst{display:flex;flex-direction:column;gap:6px}
.it{position:relative;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.6);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{border:0;padding:0;background:#e9e7e4;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;width:100%;color:var(--mute);font-weight:700}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:44px;height:44px;fill:var(--accent);opacity:.85}
.meta{padding:8px 36px 9px 10px;min-width:0;display:flex;flex-direction:column}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.meta small{color:var(--mute);font-size:.78rem}
.more{position:absolute;right:2px;bottom:6px;width:34px;height:34px;border:0;background:none;font-size:1.2rem;border-radius:50%}
.more:hover{background:var(--soft)}
#list.lst .it{flex-direction:row;align-items:center}
#list.lst .thumb{width:56px;aspect-ratio:1;flex:none}
#list.lst .thumb svg{width:28px;height:28px}
#list.lst .meta{flex:1}
#list.lst .more{position:static;margin-right:6px;flex:none}
.empty{grid-column:1/-1;text-align:center;color:var(--ink);background:var(--panel);border-radius:14px;padding:28px}
#app.drag .bar:last-of-type,#app.drag #list{outline:2px dashed var(--accent);outline-offset:4px}
#pv{width:min(92vw,900px);background:#15171a}
#pv .box{display:grid;place-items:center;max-height:80dvh}
#pv img,#pv video{max-width:100%;max-height:80dvh;display:block}
#pv .top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#eee;font-size:.9rem;gap:10px}
#pv .top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet{width:300px}
#sheet h3{padding:16px 18px 6px;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .acts{display:flex;flex-direction:column;padding:6px 8px 12px}
#sheet .acts button{border:0;background:none;text-align:left;padding:12px 10px;border-radius:10px;font-size:1rem}
#sheet .acts button:hover{background:var(--soft)}
#sheet .acts .del{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:50;max-width:90vw;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.links a{transition:none}}
</style>
</head>
<body>

<main id="home">
  <img id="av" src="assets/profile.jpg" alt="Foto profil Asakura Yoda" draggable="false">
  <h1>Asakura Yoda</h1>
  <p class="sub">@yoda.xg</p>
  <nav class="links">
    <a href="https://wa.me/6287821836877" target="_blank" rel="noopener">WhatsApp</a>
    <a href="https://instagram.com/yoda.xg" target="_blank" rel="noopener">Instagram</a>
  </nav>
</main>

<dialog id="login">
  <form id="lf" autocomplete="on">
    <h2>Masuk</h2>
    <label>Nama<input id="u" name="username" autocomplete="username" autocapitalize="none" required></label>
    <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <p id="err" role="alert"></p>
    <div class="row"><button class="btn" type="submit" style="flex:1">Masuk</button><button class="btn ghost" type="button" id="lc">Batal</button></div>
  </form>
</dialog>

<div id="cloud" hidden>
  <div id="bgwrap"><video id="bg" src="assets/bg.mp4" autoplay muted loop playsinline preload="auto"></video></div>
  <div id="app">
    <div class="bar row">
      <div class="row" id="crumbs"></div>
      <span id="info"></span>
    </div>
    <div class="bar">
      <div class="row">
        <input class="grow" id="q" type="search" placeholder="Cari file" aria-label="Cari file">
        <select id="sort" aria-label="Urutkan">
          <option value="new">Terbaru</option><option value="old">Terlama</option>
          <option value="name">Nama A–Z</option><option value="big">Terbesar</option><option value="small">Terkecil</option>
        </select>
        <button class="btn ghost sm" id="vw">Daftar</button>
      </div>
      <div class="row" style="margin-top:8px">
        <div class="chips grow" id="chips"></div>
        <button class="btn ghost sm" id="nf">Folder baru</button>
        <button class="btn sm" id="upb">Unggah</button>
        <button class="btn ghost sm" id="out">Keluar</button>
        <input id="file" type="file" multiple hidden>
      </div>
    </div>
    <div id="list" class="grid"></div>
  </div>
</div>

<dialog id="pv"><div class="top"><span id="pvn"></span><button class="btn ghost sm" id="pvc" style="color:#eee;border-color:#555">Tutup</button></div><div class="box" id="pvb"></div></dialog>
<dialog id="sheet"><h3 id="sn"></h3><div class="acts" id="sa"></div></dialog>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* === ISI DUA BARIS INI dari Supabase: Project Settings > API === */
const CFG = { url: 'https://zmmmgnqwvfrvpbsaepez.supabase.co', key: 'sb_publishable_fjqAfJZwIVry2R4Yb_DBSQ_eUXurWjy', bucket: 'cloud', domain: 'yodacloud.app' };

const sb = supabase.createClient(CFG.url, CFG.key);
const $ = s => document.querySelector(s);
const B = () => sb.storage.from(CFG.bucket);
const st = { path: [], sort: 'new', type: 'all', view: 'grid', q: '', items: [] };
const TYPES = { all: 'Semua', img: 'Foto', vid: 'Video', doc: 'Dokumen', etc: 'Lainnya' };
const EXT = { img: /^(jpe?g|png|gif|webp|avif|bmp|svg|heic)$/i, vid: /^(mp4|webm|mov|mkv|m4v)$/i, doc: /^(pdf|docx?|xlsx?|pptx?|txt|md|csv|zip|rar)$/i };
const kind = n => { const e = n.split('.').pop(); return EXT.img.test(e) ? 'img' : EXT.vid.test(e) ? 'vid' : EXT.doc.test(e) ? 'doc' : 'etc'; };
const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fp = n => [...st.path, n].join('/');
const size = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const day = d => d ? new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const clean = n => n.normalize('NFKD').replace(/[^\w.\-() ]/g, '_').replace(/ /g, '_');
const SORT = {
  new: (a, b) => b.date.localeCompare(a.date), old: (a, b) => a.date.localeCompare(b.date),
  name: (a, b) => a.name.localeCompare(b.name, 'id', { numeric: true }), big: (a, b) => b.size - a.size, small: (a, b) => a.size - b.size
};
let tt;
function toast(m, keep) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); if (!keep) tt = setTimeout(() => t.hidden = true, 3200); }

/* --- Home: 12 ketukan pada foto profil --- */
let taps = 0, tapT, logged = false;
$('#av').addEventListener('click', () => {
  clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 3000);
  if (++taps >= 12) { taps = 0; logged ? enter() : ($('#err').textContent = '', $('#login').showModal(), $('#u').focus()); }
});
$('#lc').onclick = () => $('#login').close();
$('#lf').addEventListener('submit', async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('#u').value.trim().toLowerCase() + '@' + CFG.domain, password: $('#p').value });
  if (error) { $('#err').textContent = 'Nama atau password salah.'; return; }
  $('#p').value = ''; $('#login').close(); logged = true; enter();
});
sb.auth.getSession().then(({ data }) => { logged = !!data.session; });

function enter() { $('#home').hidden = true; $('#cloud').hidden = false; document.body.classList.add('in'); $('#bg').play().catch(() => { }); load(); }
$('#out').onclick = async () => { await sb.auth.signOut(); logged = false; st.path = []; $('#cloud').hidden = true; $('#home').hidden = false; document.body.classList.remove('in'); };

/* --- Cloud --- */
async function load() {
  $('#list').innerHTML = '<p class="empty">Memuat…</p>';
  const { data, error } = await B().list(st.path.join('/'), { limit: 1000 });
  if (error) { $('#list').innerHTML = ''; return toast(error.message); }
  st.items = data.filter(x => !/^\.(keep|emptyFolderPlaceholder)$/.test(x.name))
    .map(x => ({ name: x.name, dir: !x.id, size: x.metadata?.size || 0, date: x.created_at || x.updated_at || '', kind: x.id ? kind(x.name) : 'dir' }));
  const media = st.items.filter(x => x.kind === 'img' || x.kind === 'vid');
  if (media.length) {
    const { data: u } = await B().createSignedUrls(media.map(x => fp(x.name)), 3600);
    u?.forEach((r, i) => { media[i].url = r.signedUrl; });
  }
  render();
}
const FOLDER = '<svg viewBox="0 0 24 24"><path d="M10 4l2 2h8a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>';
function render() {
  const q = st.q.toLowerCase();
  let v = st.items.filter(x => x.name.toLowerCase().includes(q) && (st.type === 'all' || (!x.dir && x.kind === st.type)));
  const dirs = v.filter(x => x.dir).sort(SORT.name), files = v.filter(x => !x.dir).sort(SORT[st.sort]);
  v = [...dirs, ...files];
  $('#list').className = st.view === 'grid' ? 'grid' : 'lst';
  $('#list').innerHTML = v.length ? v.map(x => {
    const i = st.items.indexOf(x);
    const th = x.dir ? FOLDER : x.kind === 'img' && x.url ? `<img loading="lazy" src="${x.url}" alt="">` : x.kind === 'vid' && x.url ? `<video src="${x.url}#t=0.1" preload="metadata" muted playsinline></video>` : esc(x.name.split('.').pop().slice(0, 4).toUpperCase());
    return `<div class="it" data-i="${i}"><button class="thumb" data-a="open" aria-label="Buka ${esc(x.name)}">${th}</button><div class="meta"><span class="nm">${esc(x.name)}</span><small>${x.dir ? 'Folder' : size(x.size) + ' · ' + day(x.date)}</small></div><button class="more" data-a="more" aria-label="Menu">⋮</button></div>`;
  }).join('') : `<p class="empty">${st.items.length ? 'Tidak ada file yang cocok.' : 'Folder ini kosong. Unggah file atau seret ke sini.'}</p>`;
  const fl = st.items.filter(x => !x.dir);
  $('#info').textContent = `${st.items.length - fl.length} folder, ${fl.length} file · ${size(fl.reduce((a, b) => a + b.size, 0))}`;
  $('#crumbs').innerHTML = ['Cloud', ...st.path].map((n, i) => (i ? '<span>/</span>' : '') + `<button data-c="${i}">${esc(n)}</button>`).join('');
  $('#chips').innerHTML = Object.entries(TYPES).map(([k, l]) => `<button class="chip${st.type === k ? ' on' : ''}" data-t="${k}">${l}</button>`).join('');
  $('#vw').textContent = st.view === 'grid' ? 'Daftar' : 'Kotak';
}
$('#crumbs').onclick = e => { const c = e.target.dataset.c; if (c != null) { st.path = st.path.slice(0, +c); load(); } };
$('#chips').onclick = e => { const t = e.target.dataset.t; if (t) { st.type = t; render(); } };
$('#q').oninput = e => { st.q = e.target.value; render(); };
$('#sort').onchange = e => { st.sort = e.target.value; render(); };
$('#vw').onclick = () => { st.view = st.view === 'grid' ? 'lst' : 'grid'; render(); };
$('#list').onclick = e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const it = st.items[+b.closest('.it').dataset.i];
  b.dataset.a === 'open' ? open(it) : sheet(it);
};

async function open(it) {
  if (it.dir) { st.path.push(it.name); st.q = ''; $('#q').value = ''; return load(); }
  if (it.url) {
    $('#pvn').textContent = it.name;
    $('#pvb').innerHTML = it.kind === 'img' ? `<img src="${it.url}" alt="">` : `<video src="${it.url}" controls autoplay playsinline></video>`;
    return $('#pv').showModal();
  }
  download(it);
}
$('#pvc').onclick = () => $('#pv').close();
$('#pv').addEventListener('close', () => { $('#pvb').innerHTML = ''; });
async function download(it) {
  const { data, error } = await B().createSignedUrl(fp(it.name), 60, { download: it.name });
  if (error) return toast(error.message);
  location.href = data.signedUrl;
}
function sheet(it) {
  $('#sn').textContent = it.name;
  const acts = [['Buka', () => open(it)]];
  if (!it.dir) acts.push(['Unduh', () => download(it)], ['Ubah nama', () => rename(it)], ['Pindahkan', () => move(it)]);
  acts.push(['Hapus', () => del(it), 'del']);
  $('#sa').innerHTML = '';
  acts.forEach(([l, fn, c]) => { const b = document.createElement('button'); b.textContent = l; if (c) b.className = c; b.onclick = () => { $('#sheet').close(); fn(); }; $('#sa').append(b); });
  $('#sheet').showModal();
}
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.target.close(); });
$('#login').addEventListener('click', e => { if (e.target.id === 'login') e.target.close(); });

async function rename(it) {
  const n = prompt('Nama baru', it.name); if (!n || n === it.name) return;
  const { error } = await B().move(fp(it.name), fp(clean(n)));
  error ? toast(error.message) : load();
}
async function folders(p = '') {
  const out = [p], { data } = await B().list(p, { limit: 1000 });
  for (const x of data || []) if (!x.id) out.push(...await folders(p ? p + '/' + x.name : x.name));
  return out;
}
async function move(it) {
  const here = st.path.join('/'), list = (await folders()).filter(f => f !== here);
  $('#sn').textContent = 'Pindahkan ke…'; $('#sa').innerHTML = '';
  if (!list.length) $('#sa').innerHTML = '<p style="padding:10px;color:var(--mute)">Belum ada folder tujuan.</p>';
  list.forEach(f => {
    const b = document.createElement('button'); b.textContent = f || 'Cloud (utama)';
    b.onclick = async () => { $('#sheet').close(); const { error } = await B().move(fp(it.name), (f ? f + '/' : '') + it.name); error ? toast(error.message) : load(); };
    $('#sa').append(b);
  });
  $('#sheet').showModal();
}
async function files(p) {
  let out = []; const { data } = await B().list(p, { limit: 1000 });
  for (const x of data || []) out.push(...(x.id ? [p + '/' + x.name] : await files(p + '/' + x.name)));
  return out;
}
async function del(it) {
  if (!confirm(`Hapus ${it.dir ? 'folder' : 'file'} "${it.name}"${it.dir ? ' beserta isinya' : ''}?`)) return;
  const paths = it.dir ? await files(fp(it.name)) : [fp(it.name)];
  if (paths.length) { const { error } = await B().remove(paths); if (error) return toast(error.message); }
  toast('Terhapus'); load();
}
$('#nf').onclick = async () => {
  const n = prompt('Nama folder'); if (!n) return;
  const { error } = await B().upload(fp(clean(n)) + '/.keep', new Blob([' ']), { contentType: 'text/plain' });
  error ? toast(error.message) : load();
};
async function up(list) {
  let n = 0;
  for (const f of list) {
    toast(`Mengunggah ${++n}/${list.length}…`, true);
    const nm = clean(f.name);
    let { error } = await B().upload(fp(nm), f, { contentType: f.type || undefined });
    if (error && /exist|duplicate/i.test(error.message)) ({ error } = await B().upload(fp(Date.now() + '_' + nm), f, { contentType: f.type || undefined }));
    if (error) return toast(f.name + ': ' + error.message);
  }
  toast('Selesai diunggah'); load();
}
$('#upb').onclick = () => $('#file').click();
$('#file').onchange = e => { if (e.target.files.length) up([...e.target.files]); e.target.value = ''; };
const app = $('#app');
['dragenter', 'dragover'].forEach(ev => app.addEventListener(ev, e => { e.preventDefault(); app.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => app.addEventListener(ev, e => { e.preventDefault(); app.classList.remove('drag'); }));
app.addEventListener('drop', e => { if (e.dataTransfer.files.length) up([...e.dataTransfer.files]); });
</script>
</body>
</html>
